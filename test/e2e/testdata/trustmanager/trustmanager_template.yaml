apiVersion: operator.openshift.io/v1alpha1
kind: TrustManager
metadata:
  name: cluster
spec:
  trustManagerConfig:
    logLevel: 1
    logFormat: text
{{- if .TrustNamespace}}
    trustNamespace: "{{.TrustNamespace}}"
{{- end}}
{{- if eq .FilterExpiredCertificates "Enabled"}}
    filterExpiredCertificates: Enabled
{{- end}}
{{- if eq .SecretTargetsPolicy "Custom"}}
    secretTargets:
      policy: Custom
      authorizedSecrets:
{{- range .AuthorizedSecrets}}
        - "{{.}}"
{{- end}}
{{- end}}
{{- if eq .DefaultCAPackagePolicy "Enabled"}}
    defaultCAPackage:
      policy: Enabled
{{- end}}
