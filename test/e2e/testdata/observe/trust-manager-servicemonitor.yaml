apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trust-manager-metrics
  namespace: cert-manager
  labels:
    app: cert-manager-trust-manager
spec:
  endpoints:
  - port: metrics
    path: /metrics
    scheme: http
    interval: 30s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - cert-manager
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager-trust-manager
      app.kubernetes.io/component: metrics
