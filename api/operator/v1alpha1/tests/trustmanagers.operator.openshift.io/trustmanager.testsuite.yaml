apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "TrustManager"
crdName: trustmanagers.operator.openshift.io
tests:
  onCreate:
  # ==========================================
  # Metadata Tests
  # ==========================================
  - name: Should create TrustManager with valid name
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig: {}
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed

  - name: Should not allow creating TrustManager with invalid name
    resourceName: invalid-name
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig: {}
    expectedError: "TrustManager is a singleton, .metadata.name must be 'cluster'"

  # ==========================================
  # LogLevel Tests
  # ==========================================
  - name: Should create with logLevel 5
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 5
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 5
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed

  - name: Should not allow logLevel below minimum
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 0
    expectedError: "logLevel"

  - name: Should not allow logLevel above maximum
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 6
    expectedError: "logLevel"

  # ==========================================
  # LogFormat Tests
  # ==========================================
  - name: Should create with logFormat json
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logFormat: json
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: json
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed

  - name: Should not allow invalid logFormat
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logFormat: xml
    expectedError: "logFormat"

  # ==========================================
  # TrustNamespace Tests
  # ==========================================
  - name: Should create with custom trustNamespace
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          trustNamespace: custom-namespace
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: custom-namespace
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed

  # ==========================================
  # FilterExpiredCertificates Tests
  # ==========================================
  - name: Should create with filterExpiredCertificates Enabled
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          filterExpiredCertificates: Enabled
          filterNonCACerts: Disabled
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Enabled
          filterNonCACerts: Disabled
          webhookTLS:
            approverPolicy:
              managementState: Managed

  - name: Should not allow invalid filterExpiredCertificates value
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          filterExpiredCertificates: Invalid
          filterNonCACerts: Disabled
    expectedError: "filterExpiredCertificates"

  # ==========================================
  # FilterNonCACerts Tests
  # ==========================================
  - name: Should create with filterNonCACerts Enabled
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          filterNonCACerts: Enabled
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed

  - name: Should not allow invalid filterNonCACerts value
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          filterNonCACerts: Invalid
    expectedError: "filterNonCACerts"

  # ==========================================
  # TargetNamespaces Tests
  # ==========================================
  - name: Should create with targetNamespaces
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          targetNamespaces:
            - app-ns
            - other-ns
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          targetNamespaces:
            - app-ns
            - other-ns
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed

  - name: Should not allow invalid targetNamespaces value
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          targetNamespaces:
            - Invalid_NS
    expectedError: "targetNamespaces"

  - name: Should not allow empty targetNamespaces item
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          targetNamespaces:
            - ""
    expectedError: "targetNamespaces"

  - name: Should not allow duplicate targetNamespaces items
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          targetNamespaces:
            - app-ns
            - app-ns
    expectedError: "targetNamespaces"

  - name: Should not allow targetNamespaces item longer than 63 characters
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          targetNamespaces:
            - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expectedError: "targetNamespaces"

  - name: Should not allow more than 50 targetNamespaces items
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          targetNamespaces:
            - ns-00
            - ns-01
            - ns-02
            - ns-03
            - ns-04
            - ns-05
            - ns-06
            - ns-07
            - ns-08
            - ns-09
            - ns-10
            - ns-11
            - ns-12
            - ns-13
            - ns-14
            - ns-15
            - ns-16
            - ns-17
            - ns-18
            - ns-19
            - ns-20
            - ns-21
            - ns-22
            - ns-23
            - ns-24
            - ns-25
            - ns-26
            - ns-27
            - ns-28
            - ns-29
            - ns-30
            - ns-31
            - ns-32
            - ns-33
            - ns-34
            - ns-35
            - ns-36
            - ns-37
            - ns-38
            - ns-39
            - ns-40
            - ns-41
            - ns-42
            - ns-43
            - ns-44
            - ns-45
            - ns-46
            - ns-47
            - ns-48
            - ns-49
            - ns-50
    expectedError: "targetNamespaces"

  # ==========================================
  # DefaultCAPackage Tests
  # ==========================================
  - name: Should create with defaultCAPackage policy Enabled
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          defaultCAPackage:
            policy: Enabled
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
          defaultCAPackage:
            policy: Enabled

  - name: Should not allow invalid defaultCAPackage policy value
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          defaultCAPackage:
            policy: Invalid
    expectedError: "defaultCAPackage.policy"

  # ==========================================
  # SecretTargets Tests
  # ==========================================
  - name: Should create with secretTargets policy Custom and authorizedSecrets
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          secretTargets:
            policy: Custom
            authorizedSecrets:
              - my-trust-bundle
              - another-bundle
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
          secretTargets:
            policy: Custom
            authorizedSecrets:
              - my-trust-bundle
              - another-bundle

  - name: Should not allow secretTargets policy Custom without authorizedSecrets
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          secretTargets:
            policy: Custom
    expectedError: "authorizedSecrets must not be empty when policy is Custom"

  - name: Should not allow authorizedSecrets when policy is Disabled
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          secretTargets:
            policy: Disabled
            authorizedSecrets:
              - my-secret
    expectedError: "authorizedSecrets must be empty when policy is not Custom"

  - name: Should not allow invalid secretTargets policy value
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          secretTargets:
            policy: Invalid
    expectedError: "secretTargets.policy"

  # ==========================================
  # Deployment Config Tests
  # ==========================================
  - name: Should create with resources
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

  - name: Should create with affinity
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                          - linux
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                          - linux

  - name: Should create with tolerations
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          tolerations:
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
          tolerations:
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule

  - name: Should create with nodeSelector
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          nodeSelector:
            kubernetes.io/os: linux
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
          nodeSelector:
            kubernetes.io/os: linux

  # ==========================================
  # ControllerConfig Tests
  # ==========================================
  - name: Should create with controllerConfig labels
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig: {}
        controllerConfig:
          labels:
            custom-label: custom-value
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
        controllerConfig:
          labels:
            custom-label: custom-value

  - name: Should not allow reserved label key 'app'
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig: {}
        controllerConfig:
          labels:
            app: custom-value
    expectedError: "label key uses a reserved domain or the reserved key 'app'"

  - name: Should not allow reserved label key 'app.kubernetes.io/managed-by'
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig: {}
        controllerConfig:
          labels:
            app.kubernetes.io/managed-by: cert-manager-operator
    expectedError: "label key uses a reserved domain or the reserved key 'app'"

  - name: Should not allow RBAC aggregate label key
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig: {}
        controllerConfig:
          labels:
            rbac.authorization.k8s.io/aggregate-to-admin: "true"
    expectedError: "label key uses a reserved domain or the reserved key 'app'"

  - name: Should not allow reserved annotation key
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig: {}
        controllerConfig:
          annotations:
            cert-manager.io/inject-ca-from-secret: ns/secret
    expectedError: "annotation key uses a reserved domain"

  - name: Should create with controllerConfig annotations
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig: {}
        controllerConfig:
          annotations:
            custom-annotation: custom-value
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
        controllerConfig:
          annotations:
            custom-annotation: custom-value

  # ==========================================
  # WebhookTLS certificateDuration Tests
  # ==========================================
  - name: Should create with a valid webhookTLS certificateDuration
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateDuration: 8760h
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
            certManager:
              privateKeyAlgorithm: Ed25519
              privateKeyRotationPolicy: Always
              certificateSignatureAlgorithm: PureEd25519
              certificateDuration: 8760h

  - name: Should not allow a malformed webhookTLS certificateDuration
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateDuration: not-a-duration
    expectedError: "certificateDuration"

  - name: Should create with the minimum webhookTLS certificateDuration
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateDuration: 1h
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
            certManager:
              privateKeyAlgorithm: Ed25519
              privateKeyRotationPolicy: Always
              certificateSignatureAlgorithm: PureEd25519
              certificateDuration: 1h

  - name: Should not allow a webhookTLS certificateDuration below 1h
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateDuration: 30m
    expectedError: "certificateDuration must be at least 1h"

  - name: Should create with the minimum webhookTLS certificateRenewBefore
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateRenewBefore: 5m
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
            certManager:
              privateKeyAlgorithm: Ed25519
              privateKeyRotationPolicy: Always
              certificateSignatureAlgorithm: PureEd25519
              certificateRenewBefore: 5m

  - name: Should not allow a webhookTLS certificateRenewBefore below 5m
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateRenewBefore: 4m
    expectedError: "certificateRenewBefore must be at least 5m"

  - name: Should not allow webhookTLS certificateRenewBefore at the default duration when certificateDuration is unset
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateRenewBefore: 2160h
    expectedError: "certificateRenewBefore must be less than certificateDuration, or less than 2160h when certificateDuration is unset"

  - name: Should not allow webhookTLS certificateRenewBefore greater than or equal to certificateDuration
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateDuration: 1h
              certificateRenewBefore: 2h
    expectedError: "certificateRenewBefore must be less than certificateDuration, or less than 2160h when certificateDuration is unset"

  - name: Should create when webhookTLS certificateRenewBefore is less than certificateDuration
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              certificateDuration: 1h
              certificateRenewBefore: 30m
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
            certManager:
              privateKeyAlgorithm: Ed25519
              privateKeyRotationPolicy: Always
              certificateSignatureAlgorithm: PureEd25519
              certificateDuration: 1h
              certificateRenewBefore: 30m

  - name: Should create with a name-only webhookTLS issuerRef
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              issuerRef:
                name: corp-ca
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          logLevel: 1
          logFormat: text
          trustNamespace: cert-manager
          filterExpiredCertificates: Disabled
          filterNonCACerts: Enabled
          webhookTLS:
            approverPolicy:
              managementState: Managed
            certManager:
              privateKeyAlgorithm: Ed25519
              privateKeyRotationPolicy: Always
              certificateSignatureAlgorithm: PureEd25519
              issuerRef:
                name: corp-ca

  - name: Should not allow webhookTLS issuerRef kind other than Issuer or ClusterIssuer
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              issuerRef:
                name: corp-ca
                kind: InvalidKind
                group: cert-manager.io
    expectedError: "kind must be either 'Issuer' or 'ClusterIssuer'"

  - name: Should not allow webhookTLS issuerRef kind with non-canonical casing
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              issuerRef:
                name: corp-ca
                kind: issuer
                group: cert-manager.io
    expectedError: "kind must be either 'Issuer' or 'ClusterIssuer'"

  - name: Should not allow webhookTLS issuerRef group other than cert-manager.io
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              issuerRef:
                name: corp-ca
                kind: Issuer
                group: invalid-group.io
    expectedError: "group must be 'cert-manager.io'"

  - name: Should not allow webhookTLS issuerRef group with non-canonical casing
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              issuerRef:
                name: corp-ca
                kind: Issuer
                group: CERT-MANAGER.IO
    expectedError: "group must be 'cert-manager.io'"

  - name: Should not allow an RSA private key with an ECDSA size
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: TrustManager
      spec:
        trustManagerConfig:
          webhookTLS:
            certManager:
              privateKeyAlgorithm: RSA
              privateKeySize: 256
    expectedError: "privateKeySize must match privateKeyAlgorithm"

