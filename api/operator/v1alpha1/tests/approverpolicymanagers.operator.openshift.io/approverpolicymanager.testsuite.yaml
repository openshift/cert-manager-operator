apiVersion: apiextensions.k8s.io/v1 # Required by controller-gen when scanning fixtures.
name: ApproverPolicyManager
crdName: approverpolicymanagers.operator.openshift.io
tests:
  onCreate:
  - name: Should default a minimal singleton configuration
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: ApproverPolicyManager
      spec:
        approverPolicyConfig: {}
    expected: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: ApproverPolicyManager
      spec:
        approverPolicyConfig:
          logLevel: 1
          logFormat: text
  - name: Should reject an omitted required operand configuration
    resourceName: cluster
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: ApproverPolicyManager
      spec: {}
    expectedError: approverPolicyConfig
  - name: Should reject singleton name other
    resourceName: other
    initial: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: ApproverPolicyManager
      spec:
        approverPolicyConfig: {}
    expectedError: ApproverPolicyManager is a singleton, .metadata.name must be 'cluster'
