apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: namespace
    app.kubernetes.io/instance: system
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: cert-manager-operator
    app.kubernetes.io/part-of: cert-manager-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: deployment
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: cert-manager-operator
    app.kubernetes.io/part-of: cert-manager-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      name: cert-manager-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: cert-manager-operator
      labels:
        name: cert-manager-operator
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
                    - arm64
                    - ppc64le
                    - s390x
                - key: kubernetes.io/os
                  operator: In
                  values:
                    - linux
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - /usr/bin/cert-manager-operator
          args:
            - start
            - '--v=$(OPERATOR_LOG_LEVEL)'
            - '--trusted-ca-configmap=$(TRUSTED_CA_CONFIGMAP_NAME)'
            - '--cloud-credentials-secret=$(CLOUD_CREDENTIALS_SECRET_NAME)'
            - '--unsupported-addon-features=$(UNSUPPORTED_ADDON_FEATURES)'
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['olm.targetNamespaces']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: cert-manager-operator
            - name: RELATED_IMAGE_CERT_MANAGER_WEBHOOK
              value: registry.stage.redhat.io/cert-manager/jetstack-cert-manager-rhel9@sha256:fc851c7419e0127778c56c085633fe96fd0d1fe4840f0ec297f03332d43130c0
            - name: RELATED_IMAGE_CERT_MANAGER_CA_INJECTOR
              value: registry.stage.redhat.io/cert-manager/jetstack-cert-manager-rhel9@sha256:fc851c7419e0127778c56c085633fe96fd0d1fe4840f0ec297f03332d43130c0
            - name: RELATED_IMAGE_CERT_MANAGER_CONTROLLER
              value: registry.stage.redhat.io/cert-manager/jetstack-cert-manager-rhel9@sha256:fc851c7419e0127778c56c085633fe96fd0d1fe4840f0ec297f03332d43130c0
            - name: RELATED_IMAGE_CERT_MANAGER_ACMESOLVER
              value: registry.stage.redhat.io/cert-manager/jetstack-cert-manager-acmesolver-rhel9@sha256:4869bfc7b7f646925d337987d838c37aca6246b32c173156c961e25baef8571b
            - name: RELATED_IMAGE_CERT_MANAGER_ISTIOCSR
              value: registry.stage.redhat.io/cert-manager/cert-manager-istio-csr-rhel9@sha256:a55f74dc1cdec56f812ba9554b3482cbfea8f99e1cbb627a6c2846ca68f14ae8
            - name: RELATED_IMAGE_CERT_MANAGER_TRUST_MANAGER
              value: registry.stage.redhat.io/cert-manager/cert-manager-trust-manager-rhel9@sha256:18c2405fe1ed983c0eecd2df022b4745383d80552deba6aea67172ce3fe5c4af
            - name: RELATED_IMAGE_APPROVER_POLICY
              value: registry.stage.redhat.io/cert-manager/cert-manager-approver-policy-rhel9@sha256:e80f1e13df94f3a04d53eaafd3c41cedfdb42355734df91d14b19d76022cd22c
            - name: OPERAND_IMAGE_VERSION
              value: 1.21.3
            - name: ISTIOCSR_OPERAND_IMAGE_VERSION
              value: 0.19.1
            - name: TRUSTMANAGER_OPERAND_IMAGE_VERSION
              value: 0.26.0
            - name: APPROVERPOLICY_OPERAND_IMAGE_VERSION
              value: 0.29.0
            - name: OPERATOR_IMAGE_VERSION
              value: 1.21.0
            - name: OPERATOR_LOG_LEVEL
              value: '2'
            - name: TRUSTED_CA_CONFIGMAP_NAME
            - name: CLOUD_CREDENTIALS_SECRET_NAME
            - name: UNSUPPORTED_ADDON_FEATURES
          image: registry.stage.redhat.io/cert-manager/cert-manager-operator-rhel9@sha256:a2ccb4ef658918f89c4e890ec2709c56d8bb97c2852b21f5bcbe077336037873
          imagePullPolicy: IfNotPresent
          name: cert-manager-operator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - 'ALL'
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: 'RuntimeDefault'
          ports:
          - containerPort: 8443
            name: https
            protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: serving-cert
              mountPath: /var/run/secrets/serving-cert
              readOnly: true
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: serving-cert
          secret:
            secretName: cert-manager-operator-serving-cert
            optional: true
