apiVersion: operator.openshift.io/v1alpha1
kind: IstioCSR
metadata:
  name: default
  namespace: istio-csr          # ! Replace this with your preferred namespace name.
  annotations:
    "kubernetes.io/description": "Resource behavior is managed through IstioCSR featuregate, which is enabled by default. Please refer to the cert-manager documentation for more information on the istio-csr feature."
spec:
  istioCSRConfig:
    certManager:
      issuerRef:
        name: istio-csr-issuer  # Replace with your Issuer, ClusterIssuer, or external cert-manager issuer.
        kind: Issuer            # Optional; defaults to Issuer. Use the external issuer kind when applicable.
        group: cert-manager.io  # Optional; defaults to cert-manager.io. Set to the external issuer API group when applicable.
      # External issuer API groups are not included in the operator's default ClusterRole. When issuerRef targets a
      # third-party issuer CRD, bind config/rbac/istiocsr_external_issuer_clusterrole.yaml to the operator service account.
      # When the issuer does not expose spec.ca.secretName, provide istioCACertificate or rely on the istiod certificate Secret for the root CA bundle.
    istiodTLSConfig:
      trustDomain: cluster.local
    istio:
      namespace: istio-system   # ! Replace this with your own istio deployed namespace name.
