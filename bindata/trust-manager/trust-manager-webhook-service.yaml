apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: trust-manager
    app.kubernetes.io/instance: trust-manager
    app.kubernetes.io/managed-by: cert-manager-operator
  name: trust-manager
  namespace: cert-manager
spec:
  type: ClusterIP
  ports:
    - name: https-webhook
      port: 443
      protocol: TCP
      targetPort: 6443
  selector:
    app: trust-manager
