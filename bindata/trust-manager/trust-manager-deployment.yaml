apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-manager
  namespace: cert-manager
  labels:
    app: trust-manager
    app.kubernetes.io/name: trust-manager
    app.kubernetes.io/instance: trust-manager
    app.kubernetes.io/managed-by: cert-manager-operator
    app.kubernetes.io/part-of: cert-manager-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trust-manager
  template:
    metadata:
      labels:
        app: trust-manager
    spec:
      serviceAccountName: trust-manager
      containers:
        - name: trust-manager
          image: trust-manager:latest
          imagePullPolicy: IfNotPresent
          args:
            - --log-level=1
            - --metrics-port=9402
            - --readiness-probe-port=6060
            - --readiness-probe-path=/readyz
            - --trust-namespace=cert-manager
            - --webhook-host=0.0.0.0
            - --webhook-port=6443
          ports:
            - containerPort: 6443
              protocol: TCP
            - containerPort: 9402
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6060
            initialDelaySeconds: 3
            periodSeconds: 7
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: trust-manager-tls
            defaultMode: 420
      nodeSelector:
        kubernetes.io/os: linux
