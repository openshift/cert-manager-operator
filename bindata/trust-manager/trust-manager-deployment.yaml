apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-manager
  namespace: cert-manager
  labels:
    app: cert-manager-trust-manager
    app.kubernetes.io/name: cert-manager-trust-manager
    app.kubernetes.io/instance: cert-manager-trust-manager
    app.kubernetes.io/managed-by: cert-manager-operator
    app.kubernetes.io/part-of: cert-manager-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-manager-trust-manager
  template:
    metadata:
      labels:
        app: cert-manager-trust-manager
    spec:
      serviceAccountName: trust-manager
      containers:
        - name: trust-manager
          image: quay.io/jetstack/trust-manager:v0.20.3
          imagePullPolicy: IfNotPresent
          args:
            - --log-format=text
            - --log-level=1
            - --metrics-port=9402
            - --readiness-probe-port=6060
            - --readiness-probe-path=/readyz
            - --trust-namespace=cert-manager
            - --webhook-host=0.0.0.0
            - --webhook-port=6443
          ports:
            - containerPort: 6443
              name: webhook
              protocol: TCP
            - containerPort: 9402
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              port: 6060
              path: /readyz
            initialDelaySeconds: 3
            periodSeconds: 7
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: trust-manager-tls
